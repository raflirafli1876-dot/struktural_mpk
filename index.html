<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPK GANESPIC XXV — Interactive Mindmap & Structure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="img/Logo_xxvganespic.png" type="image/x-icon">
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-container">
        <img src="img/Logo_xxvganespic.png" alt="Logo-GANESPIC" class="header-logo">
      </div>
      <span class="brand-badge">ANGKATAN XXV</span>
      <p class="motto">Melangkah Kedepan Menuju Kemenangan</p>
      <h1>Majelis Perwakilan Kelas GANESPIC</h1>
    </header>

    <!-- Controls -->
    <div class="controls">
      <div class="tabs">
        <button class="tab-btn active" data-gedung="utsman">Gedung Utsman</button>
        <button class="tab-btn" data-gedung="tansri">Gedung Tansri</button>
      </div>
    </div>

    <!-- GEDUNG CONTENT -->
    <div id="gedung-content" class="tab-content active">
      <div class="section-title" id="gedung-title">Struktural Gedung Utsman</div>
      
      <div class="mindmap-wrapper">
        <svg class="mindmap-svg" id="mindmap-svg"></svg>
        
        <div class="mindmap-tree">
          <!-- Root / Ketua Angkatan -->
          <div class="node root" id="node-root">
            <img id="ka-img" alt="Ketua Angkatan" class="node-avatar">
            <div class="role">Ketua Angkatan XXV</div>
            <div class="name" id="ka-name">Nama Ketua Angkatan</div>
          </div>

          <!-- Ketua Gedung -->
          <div class="node ketua-gedung" id="node-ketua">
            <img id="kgedung-img" alt="Ketua Gedung" class="node-avatar">
            <div class="role" id="kgedung-role">Ketua MPK Gedung Utsman</div>
            <div class="name" id="kgedung-name">Nama Ketua Gedung</div>
          </div>

          <!-- Cabang BPH Inti -->
          <div class="branches">
            <div class="branch-col" id="col-wakil"></div>
            <div class="branch-col" id="col-sekretaris"></div>
            <div class="branch-col" id="col-bendahara"></div>
          </div>
        </div>
      </div>

      <div class="section-title">Daftar Divisi</div>
      <div class="division-grid" id="list-divisi"></div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
